services:
  # 1. Spring Boot Core Backend
  - type: web
    name: searchhub-backend
    env: java
    rootDir: backend
    buildCommand: mvn clean package -DskipTests
    startCommand: java -jar target/platform-0.0.1-SNAPSHOT.jar
    envVars:
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: searchhub-db
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: searchhub-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: searchhub-db
          property: password

  # 2. Node.js Search Analytics API
  - type: web
    name: searchhub-analytics
    env: node
    rootDir: Nodejs
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 5001
      - key: MONGO_URI
        value: mongodb+srv://Admin:SearchHub123@cluster0.svg74nb.mongodb.net/searchhub_analytics?retryWrites=true&w=majority&appName=Cluster0

  # 3. FastAPI API Gateway
  - type: web
    name: searchhub-gateway
    env: python
    rootDir: gateway
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SPRING_BACKEND_URL
        value: http://searchhub-backend:8080
      - key: NODE_JS_URL
        value: http://searchhub-analytics:5001

  # 4. React SPA Frontend (Static Site)
  - type: web
    name: searchhub-frontend
    env: static
    rootDir: DSEDBD_group_project
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: http://localhost:8001/api # Will be replaced dynamically in Render dashboard with Gateway URL + /api

databases:
  # Managed PostgreSQL Database on Render
  - name: searchhub-db
    databaseName: SearchHub
    user: searchhub_user
